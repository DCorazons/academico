# Static analysis of the four research modules (thesis proposal, section 3.2.4).
# The same file is used for every implementation; give each one its own project key
# on the command line, for example -Dsonar.projectKey=academico-ar.
sonar.sourceEncoding=UTF-8
sonar.sources=app
sonar.inclusions=\
  app/Models/Teacher.php,\
  app/Models/Course.php,\
  app/Models/Enrollment.php,\
  app/Models/Student.php,\
  app/Models/Period.php,\
  app/Models/User.php,\
  app/Models/EnrollmentStatusType.php,\
  app/Services/TeacherService.php,\
  app/Services/CourseService.php,\
  app/Services/EnrollmentService.php,\
  app/Services/CourseReportService.php,\
  app/Services/Contracts/**,\
  app/Http/Controllers/Api/**,\
  app/Contracts/**,\
  app/Repositories/**
