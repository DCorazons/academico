# Static analysis of the six research modules (thesis proposal, section 3.2.4):
# Model, Service, Controller, Repository, and Contract files. The API resources and
# form requests are shared by every implementation and are left out.
# The same file is used for every implementation; give each one its own project key
# on the command line, for example -Dsonar.projectKey=academico-ar.
sonar.sourceEncoding=UTF-8
sonar.sources=app
sonar.inclusions=\
  app/Models/Course.php,\
  app/Models/Enrollment.php,\
  app/Models/EnrollmentStatusType.php,\
  app/Models/Period.php,\
  app/Models/Student.php,\
  app/Models/Teacher.php,\
  app/Models/User.php,\
  app/Models/Material.php,\
  app/Models/Exam.php,\
  app/Models/ExamQuestion.php,\
  app/Models/ExamSubmission.php,\
  app/Models/ExamAnswer.php,\
  app/Services/CourseService.php,\
  app/Services/EnrollmentService.php,\
  app/Services/DashboardService.php,\
  app/Services/MaterialService.php,\
  app/Services/ExamService.php,\
  app/Services/CourseReportService.php,\
  app/Services/Contracts/**,\
  app/Http/Controllers/Api/**,\
  app/Contracts/**,\
  app/Repositories/**
