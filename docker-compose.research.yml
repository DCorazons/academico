# Test stack of the thesis experiment (proposal, section 3.2.3 and table 3.4).
# Each implementation runs from its own checkout, with its own .env built from
# .env.research.example. COMPOSE_PROJECT_NAME keeps containers and volumes apart.
# Only one stack runs during a test session. The database comes from the seeded
# dump: this image has no dev dependencies, so ResearchSeeder cannot run here.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    cpuset: "1"
    ports:
      - "${APP_PORT:?Set APP_PORT in .env}:80"
    env_file: .env
    environment:
      - SERVER_NAME=:80
      - DB_CONNECTION=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=academico_filament
      - DB_USERNAME=academico
      - DB_PASSWORD=secret
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/research/opcache.ini:/usr/local/etc/php/conf.d/research-opcache.ini:ro
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.8.9
    cpuset: "1"
    command:
      - --query-cache-type=OFF
      - --query-cache-size=0
      - --innodb-buffer-pool-size=128M
    environment:
      MARIADB_DATABASE: academico_filament
      MARIADB_USER: academico
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: secret
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb-data:
    driver: local
